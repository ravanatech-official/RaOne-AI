steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/raone-ai-backend:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/raone-ai-backend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'raone-ai-backend'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/raone-ai-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--service-account'
      - 'raone-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--cpu-boost'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--update-env-vars'
      - '^@^NODE_ENV=production@STORAGE_BACKEND=cloud@FIREBASE_PROJECT_ID=$PROJECT_ID@FIRESTORE_DATABASE_ID=raone-db@REQUIRE_FIREBASE_AUTH=true@STRICT_FRAME_DENY=true@GCS_BUCKET_NAME=ravanatek-raone-ai-storage@PUBLIC_APP_URL=https://raone-ai.web.app@ALLOWED_ORIGINS=https://raone-ai.web.app,https://raone-ai.firebaseapp.com'
      - '--set-secrets'
      - 'GEMINI_API_KEY=RAONE_GEMINI_API_KEY:latest,TENANT_ENCRYPTION_SECRET=RAONE_TENANT_ENCRYPTION_SECRET:latest'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/raone-ai-backend:$COMMIT_SHA'
