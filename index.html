<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaOne AI — One AI for Your World | by RavanaTec</title>
    <meta name="description" content="RaOne AI by RavanaTec — One AI for Your World. Think. Create. Act. Intelligent multi-faceted AI platform with 'Hey RaOne' voice activation." />
    <meta property="og:title" content="RaOne AI — One AI for Your World | by RavanaTec" />
    <meta property="og:description" content="RaOne AI by RavanaTec — One AI for Your World. Think. Create. Act. Intelligent multi-faceted AI platform with 'Hey RaOne' voice activation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/raone_core_symbol_1794208556087.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#000000] text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script>
      (function () {
        var bootErrors = [];
        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || (e && e.target && (e.target.src || e.target.href) ? 'Failed to load resource: ' + (e.target.src || e.target.href) : 'Unknown script error');
          if (bootErrors.length < 6) bootErrors.push(msg);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled promise rejection';
          if (bootErrors.length < 6) bootErrors.push(reason);
        });
        window.addEventListener('securitypolicyviolation', function (e) {
          if (bootErrors.length < 6) {
            bootErrors.push('CSP blocked ' + e.violatedDirective + ': ' + (e.blockedURI || 'inline'));
          }
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (window.__RAONE_BOOTED__ && root && root.childElementCount > 0) return;
          if (!root || root.childElementCount > 0) return;
          var box = document.createElement('div');
          box.style.cssText = 'min-height:100vh;width:100vw;background:#000000;color:#ececec;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;box-sizing:border-box;';
          var card = document.createElement('div');
          card.style.cssText = 'max-width:460px;width:100%;background:#171717;border:1px solid #2f2f2f;border-radius:16px;padding:24px;box-sizing:border-box;';
          var title = document.createElement('h1');
          title.textContent = 'RaOne AI Preview Recovery';
          title.style.cssText = 'margin:0 0 8px;font-size:18px;font-weight:600;color:#fff;';
          var desc = document.createElement('p');
          desc.textContent = 'The application bundle did not finish mounting in this browser window.';
          desc.style.cssText = 'margin:0 0 12px;font-size:13px;color:#a3a3a3;line-height:1.5;';
          var pre = document.createElement('pre');
          pre.textContent = bootErrors.length ? bootErrors.join('\n') : 'Module script /src/main.tsx did not initialize within timeout.';
          pre.style.cssText = 'margin:0 0 16px;padding:12px;background:#0d0d0d;border:1px solid rgba(239,68,68,0.35);border-radius:10px;color:#fca5a5;font-size:12px;white-space:pre-wrap;word-break:break-word;';
          var btn = document.createElement('button');
          btn.textContent = 'Reload Preview';
          btn.style.cssText = 'padding:8px 16px;border-radius:10px;border:none;background:#ffffff;color:#000000;font-size:13px;font-weight:600;cursor:pointer;';
          btn.onclick = function () { window.location.reload(); };
          card.appendChild(title);
          card.appendChild(desc);
          card.appendChild(pre);
          card.appendChild(btn);
          box.appendChild(card);
          root.appendChild(box);
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
